[profile.ci]
# Stop at the first test failure in CI
fail-fast = true
# Retry failed tests up to 2 times
retries = 2
# set slow timeout to 5 minutes and test termination to 20 minutes total (4 periods of 5 minutes)
slow-timeout = { period = "5m", terminate-after = 4, on-timeout = "fail" }

# --- Output and Verbosity Configuration ---

# When to display standard output and standard error for failing tests
# Options: "immediate", "immediate-final", "final", "never"
failure-output = "final"
# When to display standard output and standard error for passing tests
# Options: "immediate", "immediate-final", "final", "never"
success-output = "never"
# Which test statuses (PASS, FAIL, etc.) to display during the run
# Options: "none", "fail", "retry", "slow", "leak", "pass", "skip", "all"
status-level = "pass"

[profile.ci.junit]
# Create JUnit output that we can parse
path = "../../../junit.xml"

[profile.ci-sequential]
inherits = "ci"
# The number of tests to run simultaneously
# Options: A positive integer (e.g., 4), "num-cpus", or a negative integer (e.g., -1)
test-threads = 1

[profile.ci-parallel]
inherits = "ci"
# The number of tests to run simultaneously
# Options: A positive integer (e.g., 4), "num-cpus", or a negative integer (e.g., -1)
test-threads = "num-cpus"

# Profile for the nightly flakiness hunt (`tests-flaky-nightly.yml`).
#
# The nightly exists to *measure* flakiness, so it deliberately diverges from
# the `ci` profile. Do not "fix" these settings to match `ci`.
[profile.ci-nightly]
inherits = "ci"
# A single attempt per test IS the datapoint. With retries a test that fails and
# then passes reports green, which hides exactly the fail-then-pass flakes this
# run exists to find: at a 30% per-attempt failure rate, a test survives three
# attempts ~97% of the time and looks healthy on all but a handful of nights.
retries = 0
# One failing test must never suppress results for the rest of its partition.
fail-fast = false
# Nightly runs one test per job, same as `ci-sequential`.
test-threads = 1
