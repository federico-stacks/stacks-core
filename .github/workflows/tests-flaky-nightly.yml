# Nightly flakiness hunt over the Bitcoin integration tests.
#
# Step 1: run the existing Bitcoin test workflow on a schedule with retries
# disabled, and keep the JUnit reports. Nothing is reported anywhere yet.
#
# Why retries are disabled:
#   PR CI runs the `ci` nextest profile with `retries = 2`, so a test that fails
#   and then passes reports green. Those fail-then-pass flakes are the majority
#   of what this workflow exists to find - at a 30% per-attempt failure rate a
#   test survives three attempts ~97% of the time. The `ci-nightly` profile sets
#   `retries = 0` so a single attempt per test is the datapoint.
#
# Why nightly, and not on pull requests:
#   A failure here cannot be blamed on a pull request's changes, which removes
#   the main confound when attributing a failure to the test itself.
#
# The test set, partitioning and exclusions are exactly those PR CI uses: this
# workflow only swaps the nextest profile.

name: "Tests: Flaky Nightly"
run-name: "Tests: Flaky Nightly [${{ github.ref_name }}]"

on:
  # schedule:
    # 0200 UTC daily. Deliberately clear of the 0500 UTC nightlies, since this
    # run occupies ~300 jobs.
  #  - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      only-tests:
        description: "Fully qualified test name(s), comma-separated. Empty runs the full set."
        required: false
        default: ""
        type: string
      dry-run:
        description: "Print issue mutations instead of performing them"
        required: false
        default: false
        type: boolean
      quiet-after:
        description: "Quiet scheduled runs before an issue is closed (0 = close as soon as it passes)"
        required: false
        default: "14"
        type: string
      quiet-run-events:
        description: "Workflow events that count as a chance to fail. Add workflow_dispatch to test the threshold"
        required: false
        default: "schedule"
        type: string
      orphan-after:
        description: "Runs a test may go unobserved before its issue closes as unwatched (must exceed quiet-after)"
        required: false
        default: "30"
        type: string
      mass-failure-threshold:
        description: "Failures at or above which the run is treated as broken: nothing filed, nothing closed as unwatched"
        required: false
        default: "15"
        type: string
      max-new-issues:
        description: "Cap on issues created in a single run"
        required: false
        default: "10"
        type: string
      nextest-profile:
        description: "Nextest profile to run with"
        required: false
        default: "ci-nightly"
        type: string
      slack-notify:
        description: "Post to Slack if the run breaks (scheduled runs always do)"
        required: false
        default: false
        type: boolean

# Set default permissions for all jobs
permissions:
  contents: read

# Set default shell
defaults:
  run:
    shell: bash

# Configure concurrency
concurrency:
  group: flaky-nightly-${{ github.ref }}
  cancel-in-progress: true

# Env vars
env:
  TEST_ARCHIVE_FILE: "./test_archive.tar.zst"
  DEBUG_BINARY_PATH: "./target/debug/"
  # nextest profile with retries disabled (see .github/nextest/ci-nextest.toml).
  #
  # Do NOT name this NEXTEST_PROFILE: that variable is read by cargo-nextest
  # itself, and workflow-level env reaches every job. The archive build runs
  # `cargo nextest archive` without --config-file, so it would try to resolve
  # this profile against the built-in set and fail with
  # "profile `ci-nightly` not found (known profiles: default, default-miri)"
  # after having already spent several minutes compiling.
  NIGHTLY_NEXTEST_PROFILE: "ci-nightly"

jobs:
  ############################################################################
  ### Global Variables Setup
  ###
  ### Bridges global env variables to the jobs context so they are safely
  ### accessible by the reusable test workflow.
  ############################################################################
  setup-env:
    name: "Setup: Global Variables"
    runs-on: ubuntu-latest
    outputs:
      test-archive-file: ${{ steps.set-env.outputs.test_archive_file }}
      debug-binary-path: ${{ steps.set-env.outputs.debug_binary_path }}
      nextest-profile: ${{ steps.set-env.outputs.nextest_profile }}
    steps:
      - name: Export Env Variables
        id: set-env
        run: |
          # Capture the archive file input, then expand the leading ~ to $HOME
          INPUT_FILE="${{ env.TEST_ARCHIVE_FILE }}"
          ARCHIVE_FILE="${INPUT_FILE/#\~/$HOME}"

          # Scheduled runs have no inputs, so fall back to the env default
          PROFILE="${{ inputs.nextest-profile }}"
          PROFILE="${PROFILE:-${{ env.NIGHTLY_NEXTEST_PROFILE }}}"

          echo "test_archive_file=$ARCHIVE_FILE" >> $GITHUB_OUTPUT
          echo "debug_binary_path=${{ env.DEBUG_BINARY_PATH }}" >> $GITHUB_OUTPUT
          echo "nextest_profile=$PROFILE" >> $GITHUB_OUTPUT

          echo "### Flaky Nightly setup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| nextest profile | \`$PROFILE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ref | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY

  ############################################################################
  ### Check Reusable Test Caches
  ###
  ### Both the archive build and the test jobs restore caches with
  ### `fail-on-cache-miss: true`, so a missing cache otherwise surfaces as an
  ### opaque restore failure partway through the run. This job checks both up
  ### front and fails with a summary table naming the missing cache and a link
  ### to create-test-caches.yml.
  ###
  ### Caches are only ever created by create-test-caches.yml (push to `main`, or
  ### manual dispatch) - no other workflow, including this one, saves them.
  ############################################################################
  check-test-caches:
    name: "Check: Test Caches"
    uses: ./.github/workflows/_check-test-caches.yml

  ############################################################################
  ### Create Nextest Archive Artifact for Tests
  ############################################################################
  create-nextest-archive:
    name: "Create: Nextest Archive Artifact"
    needs:
      - check-test-caches
      - setup-env
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      #   - only .github is required for this job
      - name: Checkout the latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github

      # Create Nextest archive artifact
      - name: Create Nextest Archive Artifact
        uses: ./.github/actions/artifacts/nextest-archive
        with:
          action: create
          archive-file: ${{ needs.setup-env.outputs.test-archive-file }}
          debug-binary-path: ${{ needs.setup-env.outputs.debug-binary-path }}

  ############################################################################
  ### Run Bitcoin Tests
  ###
  ### Same test set, exclusions and partitioning as PR CI. Only the nextest
  ### profile differs. Code coverage is skipped: this run measures flakiness,
  ### and PR CI already produces the coverage report.
  ############################################################################
  tests-bitcoin:
    name: "Tests: Bitcoin"
    needs:
      - create-nextest-archive
      - setup-env
    uses: ./.github/workflows/_tests-bitcoin.yml
    with:
      archive-file: ${{ needs.setup-env.outputs.test-archive-file }}
      debug-binary-path: ${{ needs.setup-env.outputs.debug-binary-path }}
      nextest-profile: ${{ needs.setup-env.outputs.nextest-profile }}
      only-tests: ${{ inputs.only-tests }}
      upload-junit-xml: "true"
      upload-code-coverage: "false"

  ############################################################################
  ### Report Failed Tests
  ###
  ### Runs in the same workflow run as the tests, so it reads the JUnit reports
  ### minutes after they are written - the artifacts' 1 day retention does not
  ### matter here and no external store is needed.
  ###
  ### Answers only "which tests failed?". Classifying failures and filing
  ### issues are separate steps.
  ############################################################################
  report:
    name: "Report: Failed Tests"
    # always(): the test jobs are expected to fail when a flaky test trips, and
    # that failure is exactly what needs reporting.
    if: always() && !cancelled()
    needs:
      - tests-bitcoin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # issues: file and comment on the per-test issues
      issues: write
    env:
      JUNIT_DIR: "nextest_files"
      OBSERVED_TESTS_FILE: "observed-tests.jsonl"
      FLAKY_LABEL: "flaky"
      MAX_NEW_ISSUES: ${{ inputs.max-new-issues || '10' }}
      QUIET_AFTER: ${{ inputs.quiet-after || '14' }}
      QUIET_RUN_EVENTS: ${{ inputs.quiet-run-events || 'schedule' }}
      ORPHAN_AFTER: ${{ inputs.orphan-after || '30' }}
      MASS_FAILURE_THRESHOLD: ${{ inputs.mass-failure-threshold || '15' }}
      DRY_RUN: ${{ inputs.dry-run == true }}
    steps:
      # Checkout the code
      #   - only .github is required for this job
      - name: Checkout the latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github

      # Download the nextest JUnit reports produced by the test jobs
      #   - pattern is narrowed to the per-test reports on purpose. `nextest-*`
      #     also matches `nextest-archive`, which is ~580 MB of test archive
      #     plus debug binaries: it would be downloaded and unpacked every run
      #     only to be ignored, since it contains no .xml. The bitcoin suite
      #     names its reports nextest-isolated-test-<index>; another suite added
      #     here later would need its own naming included.
      #   - allowed to fail the job. download-artifact hard-errors when the
      #     pattern matches nothing, and that is the clearest possible report of
      #     "there were no results": the step's own name says which stage broke.
      #     It used to carry continue-on-error so the report script could
      #     explain the situation in the job summary instead, but that summary
      #     tells the reader to check the archive and test jobs - actively wrong
      #     advice when it was the fetch that failed, and the run finished green
      #     besides. Both are fixed at the source now, and failing here also
      #     stops a partial fetch from being triaged as though whole partitions'
      #     tests had vanished.
      - name: Download nextest JUnit artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: nextest-isolated-test-*
          path: ${{ env.JUNIT_DIR }}
          merge-multiple: true

      # xmllint is not preinstalled on ubuntu-latest
      - name: Install libxml2-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      # Parse the reports into a job summary plus files for later steps
      - name: Report Failed Tests
        run: |
          bash ./.github/scripts/flaky_report.sh

      # File or comment on one issue per failing test
      #   - runs after the report, reading the JSONL it produced from the
      #     working directory, so no artifact is needed to pass data along
      - name: File Flaky Test Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # actions: read is not needed - `gh run list` on a public repo works
          # with the default token's contents scope
          NIGHTLY_WORKFLOW: tests-flaky-nightly.yml
        run: |
          bash ./.github/scripts/flaky_issues.sh

  ############################################################################
  ### Slack Alert
  ###
  ### Posts ONLY when the harness misbehaves - never when a test fails.
  ###
  ### This workflow is red almost every night by design: failing tests are its
  ### expected output. Alerting on that would train everyone to mute the
  ### channel, and the real breakages would then be invisible too. So
  ### `tests-bitcoin` is deliberately absent from the condition below - its
  ### result is `failure` whenever any test fails, and carries no information.
  ###
  ### Omitting it costs nothing, because a harness failure inside it still
  ### surfaces: no JUnit reports reach the report job, which exits non-zero on
  ### "no tests observed". That same exit is what makes a failed artifact
  ### download visible at all - it would otherwise finish the run green.
  ###
  ### `report` therefore acts as a broad backstop, but the upstream jobs are
  ### listed explicitly anyway: the backstop depends on the download step and
  ### the precondition staying as they are, and naming the jobs is what lets
  ### this say WHICH one failed.
  ###
  ### `== failure` throughout, not `!= success`. A job skipped because an
  ### upstream one failed must not alert - the failure itself already does - and
  ### `!= success` would fire on every run once this workflow is gated to the
  ### official repo, since every job is then skipped.
  ############################################################################
  notify:
    name: "Slack: Workflow Errors"
    needs:
      - setup-env
      - check-test-caches
      - create-nextest-archive
      - report
    if: >-
      always() && !cancelled() && (
        needs.setup-env.result == 'failure' ||
        needs.check-test-caches.result == 'failure' ||
        needs.create-nextest-archive.result == 'failure' ||
        needs.report.result == 'failure'
      )
    runs-on: ubuntu-latest
    steps:
      # Scheduled runs always notify; a manual dispatch only when asked, so
      # testing the workflow does not page anyone. A fork has no webhook
      # secret, so say so and stop rather than failing the job.
      - name: Resolve whether to notify
        id: resolve
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_CI_NIGHTLY }}
          EVENT_NAME: ${{ github.event_name }}
          WANT_NOTIFY: ${{ inputs.slack-notify }}
        run: |
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            notify="true"
          else
            notify="${WANT_NOTIFY:-false}"
          fi

          if [[ -z "${SLACK_WEBHOOK}" ]]; then
            echo "::notice title=Slack disabled::SLACK_WEBHOOK_CI_NIGHTLY is not set"
            notify="false"
          fi

          echo "notify=${notify}" >> "$GITHUB_OUTPUT"
          echo "Slack notify: ${notify}"

      - name: Post to Slack
        if: steps.resolve.outputs.notify == 'true'
        uses: slackapi/slack-github-action@e090a7a7c0b2d9b7ae32bd34f086e680ce260b06 # v3.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_CI_NIGHTLY }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":warning: ${{ github.workflow }} — Workflow Error",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The workflow failed due to unexpected error or special conditions being met."
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n`${{ github.ref_name }}`"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run",
                        "emoji": true
                      },
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

